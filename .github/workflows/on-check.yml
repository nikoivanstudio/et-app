name: Pull requests check

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 20.x.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # Отдельным шагом, хотя эти же тесты уже прошли выше: когда падает
      # именно SEO-проверка (метаданные, индексация, микроразметка),
      # это видно в списке шагов, а не внутри общего прогона на две сотни
      # тестов. Обход живых адресов из sitemap — по расписанию,
      # см. sitemap-audit.yml.
      - name: SEO checks
        run: npm run test:seo
