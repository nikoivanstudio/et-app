<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Oswald:wght@300;400;500&family=Caladea:wght@400;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; } /* Tailwind preflight */
    :root {
      --cta: #b8915a; --on-cta: #1f1a12;
      --gold-photo: #e8b055; --gold-head: #8b6f3d; --gold-ink: #7d6234; --gold-plate: #b8915a;
      --ink: #1f1a12; --ink-muted: #6b5f47; --ink-faint: #7f6f52;
      --cream: #fbf7ee; --cream-deep: #f4ecdd; --rule: #e2d5b7;
      --r-pill: 999px; --r-block: 16px; --r-control: 10px;
    }
    body { margin: 0; background: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--ink); }
    .lab { display: block; margin-bottom: 6px; font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-muted); }
    .field { height: 48px; border: 1px solid var(--rule); border-radius: var(--r-control); background: #fffdf8; display: flex; align-items: center; padding: 0 14px; font-size: 14.5px; color: var(--ink-faint); }
    .field-focus { border: 1.5px solid var(--cta); color: var(--ink); }
    .cta { display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: var(--r-pill); background: var(--cta); color: var(--on-cta); font-size: 16px; font-weight: 600; letter-spacing: .04em; text-decoration: none; }
  </style>
</helmet>

<!-- Вход · был белый shadcn на zinc-800 без единого токена бренда -->
<div style="min-height: 900px; padding: 0 16px; background: var(--ink); display: flex; flex-direction: column; justify-content: center;">

  <div style="text-align: center; margin-bottom: 28px;">
    <img src="./logo.png" alt="Energy Tour" style="width: 62px; height: 70px; object-fit: contain;">
    <p style="margin: 12px 0 0; font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 2.4px; text-transform: uppercase; color: #e8b05599;">Energy Tour · Крым</p>
  </div>

  <div style="background: var(--cream); border: 1px solid var(--rule); border-radius: var(--r-block); padding: 28px 22px;">
    <h1 style="margin: 0; text-align: center; font-family: 'Poiret One', serif; font-weight: 400; font-size: 32px; letter-spacing: 2px; color: var(--gold-head);">Вход</h1>
    <p style="margin: 6px 0 0; text-align: center; font-family: 'Caladea', serif; font-size: 14px; color: var(--ink-muted);">Кабинет гида и история заявок</p>

    <div style="margin-top: 26px;">
      <span class="lab">E-mail</span>
      <div class="field">Введите адрес электронной почты</div>
    </div>
    <div style="margin-top: 16px;">
      <span class="lab">Пароль</span>
      <div class="field field-focus">••••••••••</div>
    </div>

    <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
      <a href="#" style="display: inline-flex; align-items: center; min-height: 44px; font-family: 'Oswald', sans-serif; font-size: 13px; color: var(--gold-ink); text-decoration: none;">Забыли пароль?</a>
    </div>

    <a class="cta" href="#" style="margin-top: 8px;">Войти</a>

    <p style="margin: 20px 0 0; text-align: center; font-family: 'Caladea', serif; font-size: 14px; color: var(--ink-muted);">
      Ещё нет аккаунта? <a href="/sign-up" style="color: var(--gold-ink); font-weight: 700; text-decoration: none;">Регистрация</a>
    </p>
  </div>

  <p style="margin: 24px 0 0; text-align: center; font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: .8px; color: #ffffff8c;">Заявку можно оформить и без входа — аккаунт нужен гиду</p>
</div>
</x-dc>
</body>
</html>
