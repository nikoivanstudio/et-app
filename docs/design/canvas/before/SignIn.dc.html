<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *, *::before, *::after { box-sizing: border-box; } /* Tailwind preflight */
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: #18181b; text-decoration: none; font-weight: 500; } a:hover { text-decoration: underline; }
  </style>
</helmet>

<!-- (auth)/layout · w-screen h-screen pt-[15vh] flex justify-center bg-zinc-800 -->
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 127px; display: flex; justify-content: center; background: #27272a;">

  <!-- AuthFormLayout · Card w-full max-w-md mb-30 -->
  <div style="width: 100%; height: fit-content; margin-bottom: 120px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; background: #ffffff; color: #09090b; border: 1px solid #e4e4e7; border-radius: 14px; padding: 24px 0; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);">

    <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 24px;">
      <div style="font-size: 24px; font-weight: 700; line-height: 1; text-align: center;">Вход</div>
      <div style="font-size: 14px; color: #71717a; text-align: center;">Доброе пожаловать!</div>
    </div>

    <div style="padding: 0 24px;">
      <form style="display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="font-size: 14px; font-weight: 500; line-height: 1;">E-mail</label>
          <div style="display: flex; align-items: center; height: 36px; box-sizing: border-box; border: 1px solid #e4e4e7; border-radius: 6px; background: transparent; padding: 4px 12px; font-size: 14px; color: #71717a; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);">Введите адрес электронной почты</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="font-size: 14px; font-weight: 500; line-height: 1;">Пароль</label>
          <div style="display: flex; align-items: center; height: 36px; box-sizing: border-box; border: 1px solid #09090b; border-radius: 6px; background: transparent; padding: 4px 12px; font-size: 14px; color: #09090b; box-shadow: 0 0 0 3px rgba(113,113,122,0.5);">••••••••••</div>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 36px; box-sizing: border-box; border-radius: 6px; background: #18181b; color: #fafafa; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);">Войти</div>
      </form>
    </div>

    <div style="display: flex; justify-content: center; padding: 0 24px;">
      <p style="margin: 0; font-size: 14px; color: rgba(9, 9, 11, 0.5);">Вы не зарегистрированы? <a href="#">Регистрация</a></p>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
